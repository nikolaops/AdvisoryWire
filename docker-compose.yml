services:
  postgres:
    image: postgres:16-alpine
    container_name: advisorywire-db
    environment:
      POSTGRES_DB: advisorywire_db
      POSTGRES_USER: advisorywire
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - advisorywire_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advisorywire"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: advisorywire-app
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: advisorywire_db
      DATABASE_USER: advisorywire
      DATABASE_PASSWORD: postgres
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID}
      NODE_ENV: production
      LOG_LEVEL: info
      PORT: 3000
      CISA_KEV_POLL_INTERVAL: "0 */6 * * *"
      OSV_POLL_INTERVAL: "0 */6 * * *"
      DIGEST_SCHEDULE: "0 9 * * *"
      DIGEST_TIMEZONE: UTC
      INSTANT_ALERT_SEVERITIES: critical,high
      INSTANT_ALERT_IF_EXPLOITED: "true"
      DIGEST_SEVERITIES: medium,low
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  advisorywire_postgres_data:
